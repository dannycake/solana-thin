[package]
name = "solana-thin"
description = "A thin client for Solana after Alpenglow: verify that a block is final and that your transaction is in it, from a small proof."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["solana", "light-client", "alpenglow", "bls", "merkle"]
categories = ["cryptography::cryptocurrencies"]

[features]
default = []
# Deterministic block and validator builders used by the test suite and examples.
# Never needed by a verifier.
testkit = []
# Checks a certificate against an older validator set when the right one has
# not been pinned. UNSOUND: its safety argument has a counterexample, see
# docs/DESIGN.md ("Stale-set mode"). Off by default; never enable it where a
# wrong answer costs anything.
unsound-stale-set = []

[dependencies]
blst = { version = "0.3.14", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
solana-thin = { path = ".", features = ["testkit"] }
serde_json = "1"
hex = "0.4"
blst = { version = "0.3.14", default-features = false }

[[example]]
name = "anchor"
required-features = ["testkit"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
