# Every check an Agave v4.4.1 validator applies between "a data shred arrives"
# and "a transaction in that block is treated as executed in a finalized
# block", and what the verifier does about each.
#
# status:
#   enforced    the verifier applies the same rule or a stricter one; `test`
#               names the test that shows it.
#   implied     the verifier does not check it and does not need to; `premise`
#               names the fact that makes that safe.
#   documented  not a check the verifier can make; the docs say what it means.
#   planned     the verifier should enforce it and does not yet; `test` names
#               the test that will show it.
#   na          not a rule about what is in a block.
#
# Agave paths are relative to the Agave repository at tag v4.4.1. This file is
# the source; docs/CONFORMANCE.md is generated from it by
# scripts/conformance.py, and tests/conformance_ledger.rs checks that every
# test and premise named here exists.

agave_tag = "v4.4.1"

[[premise]]
id = "votes-follow-replay"
text = "Validators vote for a block only after replaying it without error, and at most 20% of stake is Byzantine. So a block that dies in replay, or is never replayed, is never finalized."
note = "This is the trust assumption, not something the oracle can show. The oracle shows the other half: that Agave marks the slot dead."
oracle_cases = []

[[premise]]
id = "dropped-shreds-never-complete"
text = "A shred that the fetch filter or sanitize drops is never inserted, whether it arrived by turbine, by repair, or out of erasure recovery. A block that needs it never becomes full."
oracle_cases = []

[[premise]]
id = "replay-from-zero"
text = "With no UpdateParent, replay reads every shred from index 0."
oracle_cases = []

[[premise]]
id = "component-parse-kills"
text = "If any one component fails to parse, the slot dies."
oracle_cases = []

[[premise]]
id = "every-batch-executed"
text = "Every entry batch is executed. Nothing may follow the boundary tick."
oracle_cases = []

[[premise]]
id = "every-transaction-commits-or-kills"
text = "Every transaction in an executed batch is committed or kills the block. None is silently skipped."
note = "Committed has three shapes; see rows 105 to 107."
oracle_cases = []

